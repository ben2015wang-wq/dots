name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax check
        run: |
          for f in src/*.js src/parts/*.js src/pwa/sw.js; do node --check "$f"; done
      - name: Build
        run: python src/build.py --out dist
      - name: Install browser for the smoke test
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Smoke test
        run: python tests/smoke.py dist
