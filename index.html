// Firestore forbids arrays directly inside arrays: store [[x,y],...] as {__aa:1,d:[flat],l:[lengths]}
function enc(v){if(Array.isArray(v)){if(v.some(Array.isArray)){const d=[],l=[];v.forEach(x=>{if(!Array.isArray(x))throw new Error('mixed nested array');l.push(x.length);x.forEach(y=>d.push(y))});return{__aa:1,d,l}}return v.map(enc)}if(v&&typeof v==='object'){const o={};for(const k in v)if(v[k]!==undefined)o[k]=enc(v[k]);return o}return v}

:root[data-wb="light"]{--bg:#f6f6f4;--side:#ffffff;--card:#ffffff;--pop:#ffffff;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.17);--tx:#1b1b1d;--mu:#6e6e76;--ac:#3b6cf6;--hv:rgba(0,0,0,.05);--sel:rgba(0,0,0,.07);--dang:#d63a3a;color-scheme:light}
:root{--sel:rgba(255,255,255,.08);--dang:#ff8080;--bg:#0e0e10;--side:#121214;--card:#1a1a1d;--pop:#212124;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.15);--tx:#ececee;--mu:#8a8a93;--ac:#8197ff;--hv:rgba(255,255,255,.055);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 Inter,-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;display:grid;grid-template-columns:244px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#side{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow-y:auto;min-height:0}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:600;font-size:15px}
.logo{gap:12px;font-size:14px;letter-spacing:.3em}.logo svg{width:28px;height:28px;flex:none;color:var(--tx)}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--mu);cursor:pointer;user-select:none;border:1.5px dashed transparent}
.nv:hover{background:var(--hv);color:var(--tx)}.nv.on{background:var(--sel);color:var(--tx)}.nv.over{border-color:var(--ac);background:rgba(129,151,255,.1);color:var(--tx)}
.nv .l{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nv .n{font-size:11px;opacity:.55}.nv input{width:100%}
.nv .x{display:none;border:0;background:none;padding:0;color:var(--mu)}.nv .x svg{width:13px;height:13px}.nv:hover .x{display:block}.nv:hover .n{display:none}.nv:has(.x):hover .x:hover{color:#ff7a7a}
.sh{display:flex;justify-content:space-between;align-items:center;padding:20px 10px 6px;color:var(--mu);font-size:12px}
.ib{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--mu)}.ib:hover{background:var(--hv);color:var(--tx)}.ib.on{background:rgba(255,255,255,.09);color:var(--tx)}
.mu{color:var(--mu);padding:6px 10px;font-size:12px}
.foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--bd)}.foot .bar{height:4px;border-radius:2px;background:var(--hv);margin:8px 0 6px;overflow:hidden}.foot .bar i{display:block;height:100%;width:18%;background:var(--mu);border-radius:2px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--bd)}
#burger{display:none}
.sr{flex:1;max-width:460px;position:relative}.sr input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 40px 9px 36px;outline:none}.sr input:focus{border-color:var(--bd2)}.sr input::placeholder{color:var(--mu)}
.sr svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}.sr kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px inherit;color:var(--mu);border:1px solid var(--bd);border-radius:5px;padding:0 6px}
.fill{flex:1}
select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;outline:none;appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:2px}.seg .ib{width:30px;height:28px}
